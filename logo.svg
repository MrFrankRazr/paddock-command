<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="t d"><title id="t">Paddock Command</title><desc id="d">Paddock Command wordmark with clear PC command mark</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#21b8ff"/><stop offset="1" stop-color="#1767ff"/></linearGradient></defs><rect width="640" height="160" rx="24" fill="#06101f"/><rect x="18" y="18" width="124" height="124" rx="24" fill="#081a30" stroke="#27adff" stroke-width="3"/><text x="34" y="110" fill="#f4f9ff" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900">P</text><text x="88" y="110" fill="url(#g)" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900">C</text><text x="170" y="76" fill="#edf8ff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="900" letter-spacing="6">PADDOCK</text><text x="170" y="122" fill="url(#g)" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="900" font-style="italic" letter-spacing="11">COMMAND</text></svg>